<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Document Q&amp;A Copilot</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
  :root { --ink:#1b2430; --muted:#5d6b7a; --line:#d6dde5; --bg:#f3f6f9; --card:#fff; --accent:#0b5fa5; --mask:#b4462b; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 "Segoe UI", Roboto, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  .app { max-width:1000px; margin:0 auto; padding:24px 16px; display:grid; grid-template-columns:280px 1fr; gap:20px; }
  @media (max-width:760px){ .app{ grid-template-columns:1fr; } }
  h1 { font-size:1.25rem; margin:0 0 4px; } .sub { color:var(--muted); font-size:.9rem; margin:0 0 16px; }
  aside, main { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 14px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; } button:focus-visible, input:focus-visible { outline:3px solid #8cc4f0; outline-offset:2px; }
  input[type=text] { flex:1; border:1px solid var(--line); border-radius:6px; padding:9px 12px; font:inherit; }
  ul { padding-left:18px; margin:8px 0; } .badge { display:inline-block; font-size:.8rem; padding:2px 8px; border-radius:99px; background:#e3eefa; color:var(--accent); }
  .note { font-size:.85rem; color:var(--mask); margin-top:8px; }
  #chat { min-height:320px; max-height:55vh; overflow:auto; display:flex; flex-direction:column; gap:12px; margin-bottom:12px; }
  .msg { padding:10px 12px; border-radius:8px; white-space:pre-wrap; max-width:92%; }
  .user { align-self:flex-end; background:#e3eefa; } .bot { align-self:flex-start; background:#f6f8fa; border:1px solid var(--line); }
  .src { font-size:.8rem; color:var(--muted); margin-top:8px; border-top:1px dashed var(--line); padding-top:6px; }
  .row { display:flex; gap:8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [health, setHealth] = useState(null);
  const [docs, setDocs] = useState([]);
  const [msgs, setMsgs] = useState([]);
  const [q, setQ] = useState("");
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState("");
  const end = useRef(null);

  const loadDocs = () => fetch("/documents").then(r => r.json()).then(d => setDocs(d.documents));
  useEffect(() => { fetch("/health").then(r => r.json()).then(setHealth); loadDocs(); }, []);
  useEffect(() => { end.current && end.current.scrollIntoView({ behavior: "smooth" }); }, [msgs]);

  async function upload(e) {
    const file = e.target.files[0]; if (!file) return;
    const fd = new FormData(); fd.append("file", file);
    const r = await fetch("/upload", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) { setNote(d.detail || "Upload failed."); return; }
    const masked = Object.entries(d.pii_masked).map(([k, v]) => v + " " + k).join(", ");
    setNote(masked ? "Masked before storing: " + masked : "No personal data found.");
    loadDocs();
  }

  async function ask(e) {
    e.preventDefault();
    if (!q.trim() || busy) return;
    const question = q; setQ(""); setBusy(true);
    setMsgs(m => [...m, { role: "user", text: question }]);
    try {
      const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: "web", question }) });
      const d = await r.json();
      setMsgs(m => [...m, r.ok ? { role: "bot", text: d.answer, sources: d.sources }
                              : { role: "bot", text: "Could not answer: " + JSON.stringify(d.detail) }]);
    } catch (err) { setMsgs(m => [...m, { role: "bot", text: "Server not reachable. Is uvicorn running?" }]); }
    setBusy(false);
  }

  return (
    <div className="app">
      <aside>
        <h1>Document Q&amp;A Copilot</h1>
        <p className="sub">Answers come only from your documents.</p>
        {health && <span className="badge">{health.mode === "azure" ? "Azure OpenAI + Semantic Kernel" : "Demo mode (no Azure keys)"}</span>}
        <h2 style={{fontSize:"1rem", marginTop:20}}>Documents</h2>
        <ul>{docs.map(d => <li key={d}>{d}</li>)}</ul>
        <input type="file" accept=".txt,.md,.pdf" onChange={upload} aria-label="Upload a document" />
        {note && <p className="note">{note}</p>}
      </aside>
      <main>
        <div id="chat" aria-live="polite">
          {msgs.length === 0 && <div className="msg bot">Ask about the sample handbook, for example: "How many leave days do I get?"</div>}
          {msgs.map((m, i) => (
            <div key={i} className={"msg " + (m.role === "user" ? "user" : "bot")}>
              {m.text}
              {m.sources && m.sources.length > 0 && (
                <div className="src">Sources: {[...new Set(m.sources.map(s => s.source))].join(", ")}</div>
              )}
            </div>
          ))}
          <div ref={end} />
        </div>
        <form className="row" onSubmit={ask}>
          <input type="text" value={q} onChange={e => setQ(e.target.value)} placeholder="Ask a question" aria-label="Your question" />
          <button disabled={busy}>{busy ? "Thinking" : "Ask"}</button>
        </form>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
